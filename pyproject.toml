[project]
name = "deauville-track"
version = "0.1.0"
description = "Object-oriented programming in Python - the project track"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
deauville = "deauville.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "B3/side", "B5/side"]
